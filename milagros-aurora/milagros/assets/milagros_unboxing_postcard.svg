<svg width="1200" height="800" viewBox="0 0 1200 800" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- MILAGROS PHYSICAL UNBOXING POSTCARD INSERT (Cotton Paper 350 g/m²) -->
  <!-- Left Side: Front Art Collector Print -->
  <g transform="translate(40, 40)">
    <rect width="530" height="720" rx="16" fill="#0f111c" stroke="rgba(196,181,253,0.3)" stroke-width="2" />
    <circle cx="265" cy="320" r="140" fill="#c4b5fd" opacity="0.12" />
    <circle cx="265" cy="320" r="90" stroke="#c4b5fd" stroke-width="2" stroke-dasharray="4,4" />
    <path d="M220,380 C200,280 330,280 310,380" stroke="#fbbf24" stroke-width="3" fill="none" />
    <circle cx="265" cy="310" r="8" fill="#c4b5fd" />
    
    <text x="265" y="520" fill="#ffffff" font-size="22" font-family="'Cinzel', serif" font-weight="bold" text-anchor="middle" letter-spacing="4">
      LA LUZ QUE NO SUPIMOS VER
    </text>
    <text x="265" y="555" fill="#c4b5fd" font-size="12" font-family="'Space Mono', monospace" text-anchor="middle" letter-spacing="2">
      EDICIÓN MEMORIAL · CÁPSULA 01
    </text>
  </g>

  <!-- Right Side: Emotional Letter Back -->
  <g transform="translate(630, 40)">
    <rect width="530" height="720" rx="16" fill="#141724" stroke="rgba(255,255,255,0.1)" stroke-width="1.5" />
    
    <g transform="translate(40, 60)" font-family="'Plus Jakarta Sans', sans-serif">
      <text y="20" fill="#c4b5fd" font-size="14" font-weight="700" letter-spacing="2">MILAGROS // CARTA DE MEMORIA</text>
      
      <text y="70" fill="#ffffff" font-size="20" font-weight="800">Gracias por sostener este proyecto.</text>
      
      <text y="120" fill="#cbd5e1" font-size="13" line-height="1.8">
        <tspan x="0" dy="0">Mi madre se llamaba Milagros. Tardé tiempo en</tspan>
        <tspan x="0" dy="24">comprender que muchas veces perdemos a quien más</tspan>
        <tspan x="0" dy="24">nos ama por esa ignorancia involuntaria de creer que</tspan>
        <tspan x="0" dy="24">las personas son eternas y que el tiempo no se agota.</tspan>
        
        <tspan x="0" dy="36">Esta prenda no es solo tela. Es un refugio para tus</tspan>
        <tspan x="0" dy="24">días pesados y un recordatorio para mirar y amar</tspan>
        <tspan x="0" dy="24">hoy a quienes caminan a tu lado.</tspan>

        <tspan x="0" dy="36" fill="#34d399" font-weight="600">✦ El 10% de tu compra apoya directamente a programas</tspan>
        <tspan x="0" dy="24" fill="#34d399" font-weight="600">de prevención de la salud mental y la conducta suicida.</tspan>
      </text>

      <!-- Lifeline Box -->
      <g transform="translate(0, 410)">
        <rect width="450" height="70" rx="8" fill="rgba(255,255,255,0.04)" stroke="rgba(196,181,253,0.3)" />
        <text x="20" y="28" fill="#fff" font-size="12" font-weight="700">Línea 024 (Prevención de la Conducta Suicida · 24/7)</text>
        <text x="20" y="50" fill="#94a3b8" font-size="11">Teléfono de la Esperanza: 717 003 717 · No cargues el peso a solas.</text>
      </g>

      <text y="540" fill="#c4b5fd" font-size="13" font-style="italic">
        “Permítete orbitar despacio. Sigues aquí y eso es suficiente.”
      </text>
    </g>
  </g>
</svg>
