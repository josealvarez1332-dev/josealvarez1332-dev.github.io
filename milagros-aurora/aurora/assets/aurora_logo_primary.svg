<svg width="800" height="400" viewBox="0 0 800 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- AURORA PRIMARY BRAND LOGO -->
  <g transform="translate(400, 150)" text-anchor="middle">
    <!-- Pulse Horizon & Supernova Vertical Shockwave -->
    <line x1="-120" y1="0" x2="-25" y2="0" stroke="#34d399" stroke-width="6" stroke-linecap="round" />
    <line x1="25" y1="0" x2="120" y2="0" stroke="#34d399" stroke-width="6" stroke-linecap="round" />
    
    <!-- Central Pulse Wave Peaks -->
    <polyline points="-25,0 -12,-35 0,35 12,-35 25,0" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    
    <!-- Luminous Core -->
    <circle cx="0" cy="0" r="6" fill="#34d399" />

    <!-- Brand Typography (Syne Brutalist Bold) -->
    <text y="110" fill="#ffffff" font-size="46" font-weight="900" font-family="'Syne', -apple-system, sans-serif" letter-spacing="14">
      AURORA
    </text>
    
    <text y="145" fill="#34d399" font-size="14" font-family="'Space Mono', monospace" letter-spacing="6">
      RESISTENCIA &amp; FUERZA INQUEBRANTABLE
    </text>
  </g>
</svg>
